apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: prometheus-success-rate
  namespace: bluegreen-demo

spec:
  metrics:
    - name: success-rate

      interval: 30s
      count: 3

      # Guards against empty result vector (no data yet = no crash)
      successCondition: len(result) > 0 && result[0] >= 0.95

      failureLimit: 2

      provider:
        prometheus:
          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

          query: |
            sum(
              rate(
                http_requests_total{
                  status_code!~"5.."
                }[1m]
              )
            )
            /
            sum(
              rate(
                http_requests_total[1m]
              )
            )