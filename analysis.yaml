apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: prometheus-success-rate
  namespace: bluegreen-demo

spec:
  metrics:

    - name: success-rate

      interval: 30s

      count: 3

      successCondition: result[0] >= 1

      failureLimit: 1

      provider:
        prometheus:

          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

          query: |
            sum(
              rate(
                http_request_duration_seconds_count{
                  status_code!~"5.."
                }[1m]
              )
            )
            /
            sum(
              rate(
                http_request_duration_seconds_count[1m]
              )
            )