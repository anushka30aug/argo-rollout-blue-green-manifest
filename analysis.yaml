# analysis-template-http.yaml
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: http-health-check
  namespace: demo
spec:
  args:
    - name: preview-svc-url   # Injected by the Rollout at runtime
  metrics:
    - name: http-ok
      # Check every 20 seconds, 6 times total (2 minute window)
      interval: 20s
      count: 6

      # ZERO TOLERANCE: any single non-200 triggers rollback
      failureLimit: 0
            # Only HTTP 200 counts as success
      successCondition: result == '200'

      provider:
        web:
          # Hits the /health path on the preview service
          url: 'http://{{args.preview-svc-url}}/health'
          timeoutSeconds: 10

          # We only care about the HTTP status code
          jsonPath: '{$.status}'

      # What the analysis considers a failure
      failureCondition: result != '200'
